# Nginx reverse proxy to expose QMD MCP server on all interfaces
# QMD binds to localhost by default, so we proxy external requests to it

# Run nginx in foreground for Docker
daemon off;

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging (optional - can redirect to stdout for Docker)
    access_log /var/log/nginx/access.log;

    # Performance
    sendfile on;
    keepalive_timeout 65;

    # Upstream - QMD runs on localhost inside container
    upstream qmd_backend {
        server 127.0.0.1:8181;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            proxy_pass http://qmd_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP server endpoint
        location /mcp {
            proxy_pass http://qmd_backend/mcp;
            proxy_http_version 1.1;
            
            # MCP uses streaming - don't buffer
            proxy_buffering off;
            proxy_cache off;
            
            # Forward headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # MCP specific headers
            proxy_set_header Accept $http_accept;
            proxy_set_header Content-Type $content_type;
        }

        # Root redirect to health
        location / {
            return 302 /health;
        }
    }
}
